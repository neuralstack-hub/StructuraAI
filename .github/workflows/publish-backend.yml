
name: Publish StructuraAI Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ml/vision/models/**"
      - "ml/vision/experiments/grouped/best_crack_cnn_grouped_epoch8.pth"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".gitattributes"
      - ".github/workflows/publish-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-backend:
    name: Build and Publish Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify trained model checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "ml/vision/experiments/grouped/"
              "best_crack_cnn_grouped_epoch8.pth"
          )

          assert path.is_file(), "Checkpoint is missing"
          assert path.stat().st_size > 1000000, (
              "Checkpoint appears to be an LFS pointer"
          )

          print(f"Checkpoint verified: {path.stat().st_size} bytes")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/neuralstack-hub/structuraai-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
